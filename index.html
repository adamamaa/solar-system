<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 태양계 시뮬레이션 (궤도선, 배속 기능)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 기본 스타일 */
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #000000; /* 검정 배경 */
            color: #f3f4f6; /* 밝은 텍스트 */
        }
        /* 정보 텍스트 스타일 */
        #info {
            position: absolute;
            top: 10px;
            left: 50%; /* 가운데 정렬 */
            transform: translateX(-50%); /* 가운데 정렬 */
            width: auto; /* 내용에 맞게 너비 조절 */
            max-width: 90%; /* 최대 너비 제한 */
            text-align: center;
            z-index: 100;
            display:block;
            padding: 10px 15px; /* 좌우 여백 추가 */
            background-color: rgba(0, 0, 0, 0.6); /* 반투명 검정 배경 */
            border-radius: 8px; /* 둥근 모서리 */
            color: #ffffff;
            font-size: 0.9rem; /* 약간 작은 글씨 */
        }
        /* 캔버스 스타일 */
        canvas { display: block; }

        /* 속도 조절 컨트롤 스타일 */
        #controls {
            position: absolute;
            bottom: 20px; /* 하단 여백 */
            left: 50%;
            transform: translateX(-50%); /* 가운데 정렬 */
            display: flex;
            align-items: center;
            gap: 1rem; /* 요소 사이 간격 */
            background-color: rgba(31, 41, 55, 0.8); /* 반투명 어두운 회색 배경 (bg-gray-800 opacity-80) */
            padding: 0.75rem 1rem; /* 안쪽 여백 (p-3 px-4) */
            border-radius: 0.5rem; /* 둥근 모서리 (rounded-lg) */
            z-index: 110; /* 정보 텍스트보다 위에 오도록 */
        }
        #controls button {
            padding: 0.5rem 1rem; /* 버튼 안쪽 여백 (py-2 px-4) */
            background-color: #2563eb; /* 파란색 배경 (bg-blue-600) */
            color: white;
            border: none;
            border-radius: 0.375rem; /* 둥근 모서리 (rounded-md) */
            font-size: 1rem; /* 글자 크기 */
            font-weight: 600; /* 글자 굵기 (font-semibold) */
            cursor: pointer;
            transition: background-color 0.2s; /* 부드러운 색상 전환 */
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06); /* 그림자 */
            min-width: 40px; /* 버튼 최소 너비 */
            text-align: center;
        }
        #controls button:hover {
            background-color: #1d4ed8; /* 호버 시 약간 어두운 파란색 (hover:bg-blue-700) */
        }
        #speedDisplay {
            color: white;
            font-weight: 500; /* 글자 굵기 (font-medium) */
            min-width: 80px; /* 최소 너비 확보 */
            text-align: center;
        }
    </style>
</head>
<body class="bg-black text-gray-100">
    <div id="info" class="text-sm md:text-base">
        마우스 드래그: 회전 | 휠: 확대/축소 | +/-: 속도 조절
    </div>

    <div id="controls">
        <button id="slowDown" title="느리게">-</button>
        <span id="speedDisplay">Speed: 0.5x</span> {/* 초기값 반영 */}
        <button id="speedUp" title="빠르게">+</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // Three.js 및 OrbitControls 모듈 가져오기
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 전역 변수 선언
        let scene, camera, renderer, controls;
        const celestialBodies = []; // 태양, 행성 Mesh 객체 및 데이터

        // --- 배속 기능 변수 ---
        let timeScale = 0.5; // 초기 애니메이션 속도 배율
        const minTimeScale = 0.1; // 최소 배속
        const maxTimeScale = 10.0; // 최대 배속
        let lastTime = performance.now(); // 마지막 프레임 시간 추적

        // 속도 표시 업데이트 함수
        function updateSpeedDisplay() {
            const displayElement = document.getElementById('speedDisplay');
            if (displayElement) {
                // 소수점 첫째 자리까지 표시, .0이면 정수로 보이게 처리
                const speedText = timeScale.toFixed(1).replace(/\.0$/, '');
                displayElement.textContent = `Speed: ${speedText}x`;
            }
        }

        // 초기화 함수
        function init() {
            // Scene 생성
            scene = new THREE.Scene();

            // Camera 설정
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
            camera.position.z = 120;
            camera.position.y = 30;

            // Renderer 설정
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor(0x000000);
            document.body.appendChild(renderer.domElement);

            // Lighting 설정
            const ambientLight = new THREE.AmbientLight(0x666666); // 약간 더 밝게
            scene.add(ambientLight);

            // --- 태양 생성 ---
            const sunGeometry = new THREE.SphereGeometry(5, 64, 64); // 더 부드럽게
            const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const sun = new THREE.Mesh(sunGeometry, sunMaterial);
            scene.add(sun);
            celestialBodies.push({ mesh: sun, isPlanet: false });

            // PointLight (태양 위치)
            const pointLight = new THREE.PointLight(0xffffff, 3.5, 0, 0); // 밝기 조절 가능
            sun.add(pointLight);

            // --- 행성 데이터 정의 ---
            const planetData = [
                { name: '수성', size: 0.5, color: 0xaaaaaa, distance: 10, period: 88 },
                { name: '금성', size: 0.8, color: 0xffffe0, distance: 15, period: 225 },
                { name: '지구', size: 1.0, color: 0x4682b4, distance: 21, period: 365 },
                { name: '화성', size: 0.7, color: 0xff4500, distance: 30, period: 687 },
                { name: '목성', size: 2.5, color: 0xffa500, distance: 50, period: 4333 },
                { name: '토성', size: 2.0, color: 0xf4a460, distance: 75, period: 10759 },
                { name: '천왕성', size: 1.5, color: 0xadd8e6, distance: 100, period: 30687 },
                { name: '해왕성', size: 1.4, color: 0x00008b, distance: 130, period: 60190 },
            ];

            // --- 행성 생성 및 궤도선 그리기 ---
            planetData.forEach(data => {
                // 행성 Mesh 생성
                const planetGeometry = new THREE.SphereGeometry(data.size, 32, 32);
                const planetMaterial = new THREE.MeshStandardMaterial({
                    color: data.color,
                    roughness: 0.8,
                    metalness: 0.2
                });
                const planet = new THREE.Mesh(planetGeometry, planetMaterial);
                planet.position.x = data.distance; // 초기 위치 (X축 양의 방향)
                scene.add(planet);
                celestialBodies.push({
                    mesh: planet,
                    data: data,
                    isPlanet: true,
                    currentAngle: 0, // 각 행성의 현재 공전 각도 저장
                    orbitSpeedFactor: data.period ? (2 * Math.PI) / (data.period / 30) : 0 // 미리 계산 (기존 로직 유지)
                });

                // --- 궤도선 생성 ---
                const points = [];
                const segments = 128;
                const orbitRadius = data.distance;

                for (let i = 0; i <= segments; i++) {
                    const angle = (i / segments) * Math.PI * 2;
                    points.push(
                        new THREE.Vector3(
                            Math.cos(angle) * orbitRadius,
                            0,
                            Math.sin(angle) * orbitRadius
                        )
                    );
                }
                const orbitGeometry = new THREE.BufferGeometry().setFromPoints(points);
                const orbitMaterial = new THREE.LineBasicMaterial({
                    color: 0xcccccc,
                    transparent: true,
                    opacity: 0.3 // 약간 더 투명하게
                });
                const orbitLine = new THREE.LineLoop(orbitGeometry, orbitMaterial);
                scene.add(orbitLine);
            });


            // Controls 설정
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 10; // 너무 가까이 가지 않도록
            controls.maxDistance = 500;
            controls.target.set(0, 0, 0); // 컨트롤 타겟을 원점으로

            // --- 배속 버튼 이벤트 리스너 추가 ---
            const slowDownButton = document.getElementById('slowDown');
            const speedUpButton = document.getElementById('speedUp');

            if (slowDownButton) {
                slowDownButton.addEventListener('click', () => {
                    // timeScale을 1.5로 나누는 대신 고정된 값(예: 0.1 또는 0.5) 빼거나, 비율을 조정 (예: 0.8 곱하기)
                    timeScale = Math.max(minTimeScale, parseFloat((timeScale / 1.5).toFixed(2))); // 소수점 관리
                    updateSpeedDisplay();
                });
            }

            if (speedUpButton) {
                speedUpButton.addEventListener('click', () => {
                    // timeScale을 1.5 곱하는 대신 고정된 값 더하거나, 비율 조정 (예: 1.2 곱하기)
                    timeScale = Math.min(maxTimeScale, parseFloat((timeScale * 1.5).toFixed(2))); // 소수점 관리
                    updateSpeedDisplay();
                });
            }

            // 초기 속도 표시 업데이트
            updateSpeedDisplay();

            // 창 크기 변경 리스너
            window.addEventListener('resize', onWindowResize, false);
        }

        // 창 크기 변경 처리 함수
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // --- DeltaTime 계산 ---
            const currentTime = performance.now();
            const deltaTime = (currentTime - lastTime) * 0.001; // 초 단위로 변환
            lastTime = currentTime; // 다음 프레임을 위해 현재 시간 저장

            // 애니메이션 일시정지 방지 (탭 전환 등) - deltaTime이 너무 크면 건너뛰기
            if (deltaTime > 0.1) {
                return; // 예: 0.1초 이상 지연되면 해당 프레임 스킵
            }

            const effectiveDeltaTime = deltaTime * timeScale; // 실제 적용될 시간 변화량

            // --- 행성 공전 및 자전 애니메이션 ---
            celestialBodies.forEach(body => {
                if (body.isPlanet) {
                    const planetMesh = body.mesh;
                    const data = body.data;

                    // 1. 공전 각도 업데이트 (DeltaTime 사용)
                    const angleChange = body.orbitSpeedFactor * effectiveDeltaTime;
                    body.currentAngle += angleChange; // 현재 각도에 변화량 누적

                    // 2. 새 각도를 이용해 위치 계산
                    planetMesh.position.x = Math.cos(body.currentAngle) * data.distance;
                    planetMesh.position.z = Math.sin(body.currentAngle) * data.distance;

                    // 3. 자전 (DeltaTime 사용)
                    const rotationSpeed = 0.5; // 기본 자전 속도 (초당 라디안)
                    planetMesh.rotation.y += rotationSpeed * effectiveDeltaTime;
                }
            });

            controls.update(); // damping 적용 위해 필요
            renderer.render(scene, camera);
        }

        // 페이지 로드 완료 후 초기화 및 애니메이션 시작
        window.onload = () => {
            init();
            animate(); // 애니메이션 루프 시작
        };
    </script>
</body>
</html>
